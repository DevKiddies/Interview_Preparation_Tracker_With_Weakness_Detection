# Loads .env file locally. In production (Render), environment variables are used instead.
spring.config.import=optional:file:.env[.properties]

spring.application.name=server

# ─── Server ───────────────────────────────────────────────────────────────────
# Uses Render's PORT when deployed, falls back to 8080 locally
server.port=${PORT:8080}

# ─── Database ─────────────────────────────────────────────────────────────────
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# HikariCP
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=16
spring.datasource.hikari.minimum-idle=4
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ─── Redis ────────────────────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# ─── JWT ──────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET_KEY}
jwt.expiration=86400000

# ─── Brevo ────────────────────────────────────────────────────────────────────
brevo.api-key=${BREVO_API_KEY}
brevo.sender-email=${BREVO_SENDER_EMAIL}
brevo.sender-name=PrepEdge

# ─── Contact ──────────────────────────────────────────────────────────────────
contact.recipient-email=team.prepedge@gmail.com

# ─── Google OAuth ─────────────────────────────────────────────────────────────
google.client-id=${GOOGLE_CLIENT_ID}

# ─── GitHub OAuth ─────────────────────────────────────────────────────────────
github.client-id=${GITHUB_CLIENT_ID}
github.client-secret=${GITHUB_CLIENT_SECRET}
github.redirect-uri=${GITHUB_REDIRECT_URI}
github.frontend-url=${FRONTEND_URL}

# ─── Gemini ───────────────────────────────────────────────────────────────────
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent

# ─── Spring Boot Actuator ─────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=false