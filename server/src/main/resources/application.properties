# Loads .env file as property source if it exists; silently skipped in prod where real env vars are used
spring.config.import=optional:file:.env[.properties]
spring.application.name=server

# ─── Database ─────────────────────────────────────────────────────────────────
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# HikariCP connection pool. Sized to fit the service's parallel query threads
# (each dashboard endpoint fans out 2-6 queries) without starving other requests.
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=16
spring.datasource.hikari.minimum-idle=4
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1
# Disables PostgreSQL server-side prepared statements - prevents "cached plan must
# not change result type" errors when the schema changes between app restarts.
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
# Disabling open-in-view forces all DB access to happen inside the service layer,
# avoiding lazy-loading surprises in controllers or during JSON serialization.
spring.jpa.open-in-view=false
# 'update' auto-applies schema changes on startup - fine for dev/staging.
# Switch to 'validate' or use Flyway migrations before going to production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Keeps column/table names exactly as declared in @Column/@Table - no
# implicit snake_case conversion that could silently break existing columns.
spring.jpa.properties.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ─── Redis ────────────────────────────────────────────────────────────────────
# Local Redis for dev. In production, point this to your Redis Cloud/ElastiCache host.
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Redis is used only as a cache (token blacklist, banned-user cache) via RedisTemplate,
# never as a repository store. Disabling repository auto-config keeps Spring Data Redis
# from scanning the JPA repository interfaces and logging 18 misleading
# "Could not safely identify store assignment" INFO lines on every startup.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# ─── JWT ──────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET_KEY}
# 86400000 ms = 24 hours
jwt.expiration=86400000

# ─── Brevo (transactional email) ──────────────────────────────────────────────
brevo.api-key=${BREVO_API_KEY}
brevo.sender-email=${BREVO_SENDER_EMAIL}
brevo.sender-name=PrepEdge

# ─── Contact form ─────────────────────────────────────────────────────────────
# Where messages submitted via the public Contact Us form are delivered.
contact.recipient-email=team.prepedge@gmail.com

# ─── Google OAuth ─────────────────────────────────────────────────────────────
google.client-id=${GOOGLE_CLIENT_ID}

# ─── GitHub OAuth ─────────────────────────────────────────────────────────────
github.client-id=${GITHUB_CLIENT_ID}
github.client-secret=${GITHUB_CLIENT_SECRET}
# After GitHub OAuth, the user is redirected here for the token exchange
github.redirect-uri=http://localhost:8080/api/auth/github/callback
# After a successful login, we redirect to this frontend URL with the JWT in the query string
github.frontend-url=http://localhost:5173
#gemini api key and url
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent